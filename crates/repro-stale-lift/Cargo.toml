[package]
name = "repro-stale-lift"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# 复现 brush 训练里 eval/loss 渲染偏少 (~4% density) 的陈旧读 bug。
#
# 直接用真实的 xray render 模块 (brush-xray / brush-xray-bwd):
#   lift_xray_splats_to_autodiff -> render_xray (autodiff) -> loss -> backward
#   -> Adam step -> .valid(), 在多线程 tokio 下让 step 与 render 落在不同
#   worker 线程, 触发跨 stream shared_view 读到陈旧 buffer。
#
# 依赖 brush-xray / brush-xray-bwd / brush-render / brush-cube, 不依赖
# brush-train (避免引入数据集 / deform / loss 等重依赖)。

[dependencies]
brush-cube.path = "../brush-cube"
brush-render.path = "../brush-render"
brush-xray.path = "../brush-xray"
brush-xray-bwd.path = "../brush-xray-bwd"

burn = { workspace = true, features = ["wgpu", "autodiff"] }
burn-wgpu.workspace = true
burn-fusion.workspace = true

glam.workspace = true

tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
