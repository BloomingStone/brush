[package]
name = "repro-stale-lift"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# 应用无关的最小复现: burn-fusion 后端上, 带 pending op 的 fusion 张量经
# lift (AutodiffBackend::from_inner) 后读到陈旧 buffer。
#
# 不依赖任何 brush crate, 只依赖 burn / burn-wgpu / burn-fusion。

[dependencies]
burn = { workspace = true, features = ["wgpu", "autodiff"] }
burn-wgpu.workspace = true
burn-fusion.workspace = true

tokio = { workspace = true, features = ["macros", "rt"] }
