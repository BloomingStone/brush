[package]
name = "brush-cube"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
# `wgpu` feature required: host.rs uses `WgpuRuntime`/`CubeTensor<WgpuRuntime>`
# which need `WgpuDevice: DeviceOps` (gated by burn-backend/cubecl-wgpu, only
# reachable via burn's `wgpu` feature). Without it, isolated builds of any
# crate that depends on brush-cube fail (e.g. `cargo bench -p brush-sort`).
burn = { workspace = true, features = ["wgpu"] }
burn-cubecl.workspace = true
burn-wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
log.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
wasm-logger = "0.2"

[lints]
workspace = true
